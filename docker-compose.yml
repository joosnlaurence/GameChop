services:
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gamechop
      MYSQL_USER: myapp_user
      MYSQL_PASSWORD: myapp_password
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/db_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/database/views.sql:/docker-entrypoint-initdb.d/02_views.sql
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    ports:
      - "8080:3000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: gamechop
      DB_USER: myapp_user
      DB_PASSWORD: myapp_password
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
